<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Recommendation system architecture</title>
  <desc id="desc">Swipe interactions become positive implicit feedback, temporal holdouts, sparse matrix factors, and top-k recommendations.</desc>
  <rect width="1200" height="360" fill="#fbfaf7"/>
  <text x="54" y="58" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#151515">Architecture at a glance</text>
  <text x="54" y="88" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="17" font-weight="650" fill="#57534e">Swipe-style interactions are evaluated as a ranking problem, not static EDA.</text>
  <g font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-weight="800">
    <rect x="54" y="144" width="170" height="96" fill="#ffffff" stroke="#151515" stroke-width="2"/>
    <text x="84" y="186" font-size="20" fill="#151515">Swipes</text>
    <text x="84" y="214" font-size="14" fill="#57534e">implicit feedback</text>
    <rect x="282" y="144" width="170" height="96" fill="#f4f0e9" stroke="#151515" stroke-width="2"/>
    <text x="309" y="186" font-size="20" fill="#151515">Holdout</text>
    <text x="309" y="214" font-size="14" fill="#57534e">latest like</text>
    <rect x="510" y="144" width="170" height="96" fill="#f4f0e9" stroke="#151515" stroke-width="2"/>
    <text x="537" y="186" font-size="20" fill="#151515">Matrix</text>
    <text x="537" y="214" font-size="14" fill="#57534e">sparse users/items</text>
    <rect x="738" y="144" width="170" height="96" fill="#0f766e"/>
    <text x="777" y="186" font-size="20" fill="#ffffff">SVD</text>
    <text x="777" y="214" font-size="14" fill="#d7f6f0">latent factors</text>
    <rect x="966" y="144" width="170" height="96" fill="#151515"/>
    <text x="1002" y="186" font-size="20" fill="#ffffff">Top-K</text>
    <text x="1002" y="214" font-size="14" fill="#d8d2c8">HitRate / MRR</text>
  </g>
  <g stroke="#0f766e" stroke-width="4" fill="none">
    <path d="M224 192h58"/>
    <path d="M452 192h58"/>
    <path d="M680 192h58"/>
    <path d="M908 192h58"/>
  </g>
</svg>
